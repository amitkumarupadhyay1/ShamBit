[build]
builder = "NIXPACKS"
buildCommand = "cd api-nestjs && rm -f package-lock.json && npm install --legacy-peer-deps && npm run build:railway"

[deploy]
startCommand = "cd api-nestjs && npm run railway:deploy"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
# Railway will use environment variables from the dashboard